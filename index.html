<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1c0618" />
  <title>Lucky Hands · Rock Paper Scissors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <header class="topbar">
      <div class="score you">
        <span class="label">You</span>
        <span class="num" id="scoreYou">0</span>
      </div>
      <div class="brand">Lucky Hands</div>
      <div class="score priya">
        <span class="label">Priya</span>
        <span class="num" id="scorePriya">0</span>
      </div>
      <button class="icon-btn" id="muteBtn" aria-label="Toggle sound">🔊</button>
    </header>

    <section class="stage" id="stage">
      <div class="arch">
        <img class="arch-poster" src="assets/priya_scene.jpg" alt="" draggable="false" />
        <video data-video="idle" src="assets/idle.mp4" muted playsinline loop preload="auto"></video>
        <video data-video="win" src="assets/win.mp4" muted playsinline preload="auto"></video>
        <video data-video="lose" src="assets/lose.mp4" muted playsinline preload="auto"></video>
        <video data-video="tie" src="assets/tie.mp4" muted playsinline preload="auto"></video>
        <div class="flare" id="flare"></div>
      </div>
      <div class="bubble" id="bubble">Your move, handsome~</div>
      <div class="chant" id="chant"></div>
      <div class="result" id="result">
        <div class="result-hands">
          <div class="hand-side">
            <div class="hand" id="handPriya">✊</div>
            <span class="who">Priya</span>
          </div>
          <div class="vs">:</div>
          <div class="hand-side">
            <div class="hand" id="handYou">✊</div>
            <span class="who">You</span>
          </div>
        </div>
        <div class="result-title" id="resultTitle"></div>
        <div class="result-sub" id="resultSub"></div>
      </div>
    </section>

    <section class="controls">
      <button class="choice" data-choice="rock" aria-label="Rock">
        <span class="icon">✊</span>
      </button>
      <button class="choice" data-choice="paper" aria-label="Paper">
        <span class="icon">✋</span>
      </button>
      <button class="choice" data-choice="scissors" aria-label="Scissors">
        <span class="icon">✌️</span>
      </button>
    </section>

    <div class="audio-hint" id="audioHint" hidden>🔊 Tap anywhere for the music</div>

  </div>
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
